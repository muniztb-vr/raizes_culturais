spring.application.name=raizes-culturais

# ── Porta (Render injeta $PORT dinamicamente) ────────────────────────────────
server.port=${PORT:8080}

# ── DataSource — Neon / PostgreSQL ───────────────────────────────────────────
# Configure no Render: DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD
# Formato Neon: jdbc:postgresql://ep-xxxx.us-east-2.aws.neon.tech/raizes_culturais?sslmode=require
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/raizes_culturais}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — compatível com Neon free tier
# SSL deve estar no DATABASE_URL: ?sslmode=require
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Google Gemini API ─────────────────────────────────────────────────────────
# Configure no Render: GEMINI_API_KEY
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# ── URL do Frontend (para o link de recuperação de senha nos logs) ───────────
app.frontend.url=${APP_FRONTEND_URL:https://raizes-culturais.vercel.app}

# ── CORS ─────────────────────────────────────────────────────────────────────
# Configure no Render: APP_CORS_ORIGINS=https://seu-projeto.vercel.app
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
